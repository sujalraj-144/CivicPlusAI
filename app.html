    // Master App Component
    function App() {
      const [activeTab, setActiveTab] = useState('citizen'); // 'citizen' | 'tracker' | 'radar' | 'leaderboard' | 'roi' | 'iccc'
      const [issues, setIssues] = useState(INITIAL_ISSUES);
      const [trackedSrn, setTrackedSrn] = useState('CIVIC-W12-2026-8419');
      const [showAlertBanner, setShowAlertBanner] = useState(true);

      return (
        <div className="min-h-screen flex flex-col">
          {/* Top Emergency & Helpline Bar */}
          <div className="bg-slate-900 text-slate-300 text-xs px-4 py-1.5 flex flex-wrap justify-between items-center border-b border-slate-800">
            <div className="flex items-center space-x-3">
              <span className="flex items-center space-x-1.5 font-bold text-amber-400">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>MUNICIPAL CORPORATION OF SMART CITY</span>
              </span>
              <span className="hidden md:inline text-slate-600">|</span>
              <span className="hidden md:inline text-slate-400">Unified Grievance Redressal & Predictive AI System</span>
            </div>
            <div className="flex items-center space-x-4 font-mono text-xs">
              <span>Toll-Free Helpline: <strong className="text-white">1913</strong> / <strong className="text-white">112</strong></span>
              <span className="text-amber-400 font-semibold bg-amber-950/70 px-2 py-0.5 rounded border border-amber-800/50">

              </span>
            </div>
          </div>

          {/* Monsoon & Flood Early Warning Ticker */}
          {showAlertBanner && (
            <div className="bg-gradient-to-r from-amber-600 via-orange-600 to-rose-600 text-white text-xs px-4 py-2 font-medium flex items-center justify-between shadow-sm">

                <span className="bg-black/30 px-2 py-0.5 rounded-full text-[10px] font-black uppercase tracking-wider">
                  ⚠️ MONSOON WATCH
                </span>
                <span>
                  <strong>Open-Meteo Alert:</strong> 34.5mm rainfall predicted next 6 hours in Indiranagar & Seshadripuram. 3 underpasses flagged for preventive de-watering pumps.
                </span>
              </div>
              <button
                onClick={() => setActiveTab('radar')}
                className="underline hover:text-amber-100 font-bold ml-4 text-[11px] whitespace-nowrap"
              >
                View Risk Radar →
              </button>
            </div>
          )}

          {/* Main Official Header & Navigation */}

              <div className="flex items-center space-x-3.5">
                <div className="w-11 h-11 rounded-xl bg-gradient-to-br from-blue-900 to-slate-900 flex items-center justify-center text-white shadow font-black text-xl border border-blue-700/40">
                  🏛️
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <h1 className="text-xl font-black tracking-tight text-slate-900">
                      CivicPulse <span className="text-blue-600">AI</span>
                    </h1>
                    <span className="bg-blue-100 text-blue-800 text-[10px] font-bold px-2 py-0.5 rounded-full border border-blue-200">

                    </span>
                  </div>
                  <p className="text-xs text-slate-500 font-medium">
                    National Smart Cities Computer Vision Grievance Triage & Predictive Risk System
                  </p>
                </div>
              </div>

              <nav className="flex items-center flex-wrap gap-1 bg-slate-100 p-1.5 rounded-xl border border-slate-200 text-xs font-semibold">

                    activeTab === 'citizen' ? 'bg-white text-blue-700 shadow-sm border font-bold' : 'text-slate-600 hover:text-slate-900'

                <button
                  onClick={() => setActiveTab('tracker')}
                  className={`px-3 py-1.5 rounded-lg transition ${
                    activeTab === 'tracker' ? 'bg-white text-blue-700 shadow-sm border font-bold' : 'text-slate-600 hover:text-slate-900'
                  }`}
                >
                  🔍 Track SRN
                </button>

                <button
                  onClick={() => setActiveTab('radar')}

                    activeTab === 'radar' ? 'bg-white text-blue-700 shadow-sm border font-bold' : 'text-slate-600 hover:text-slate-900'

                    activeTab === 'roi' ? 'bg-white text-blue-700 shadow-sm border font-bold' : 'text-slate-600 hover:text-slate-900'

                  💰 Taxpayer ROI

                    activeTab === 'iccc' ? 'bg-slate-900 text-amber-400 font-bold shadow' : 'text-slate-700 hover:text-slate-900'
                  }`}
                >

                  <span className="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
                </button>
              </nav>

          {/* Main Body */}
          <main className="flex-1">
            {activeTab === 'citizen' && (
              <CitizenView
                onIssueCreated={(newIssue) => {

                  setTrackedSrn(newIssue.srn);
                }}
                onTrack={(srn) => {
                  setTrackedSrn(srn);
                  setActiveTab('tracker');
                }}
              />
            )}

            {activeTab === 'tracker' && (
              <TrackerView
                initialSrn={trackedSrn}
                issues={issues}
                onUpvote={(id) => {
                  setIssues(issues.map(i => i.id === id ? { ...i, upvotes: i.upvotes + 1 } : i));
                }}
              />
            )}

            {activeTab === 'radar' && (
              <MonsoonRadarView issues={issues} />
            )}

            {activeTab === 'leaderboard' && (
              <WardLeaderboardView issues={issues} />
            )}

            {activeTab === 'roi' && (
              <TaxpayerRoiView issues={issues} />
            )}

            {activeTab === 'iccc' && (
              <IcccView
                issues={issues}
                onAssign={(id, official, team, notes) => {
                  setIssues(issues.map(i => i.id === id ? {
                    ...i,
                    status: 'Assigned',
                    action: {
                      ...i.action,
                      assigned_official: official,
                      assigned_team: team,
                      recommended_action: notes || i.action?.recommended_action

                }}
                onResolve={(id, notes) => {
                  setIssues(issues.map(i => i.id === id ? {
                    ...i,
                    status: 'Resolved',
                    after_image_url: "https://images.unsplash.com/photo-1584463699042-3a339a1a5b67?w=600&auto=format&fit=crop&q=80",

                      ...i.action,
                      resolved_time: 'Just Now',
                      resolution_notes: notes
                    }
                  } : i));
                }}
                onSelectSrn={(srn) => {
                  setTrackedSrn(srn);
                  setActiveTab('tracker');
                }}
              />
            )}

              </div>
              <div className="flex items-center space-x-4 text-slate-400">
                <span>Built by <strong>Team Knox Drift</strong> (Shyam, Balaji, Sujal, Akhil)</span>
                <span>•</span>
                <span>Ministry of Housing & Urban Affairs Standards</span>
              </div>
            </div>

    // ==========================================
    // 1. CITIZEN REPORT VIEW (WITH VOICE INPUT)
    // ==========================================
    function CitizenView({ onIssueCreated, onTrack }) {
      const [photoUrl, setPhotoUrl] = useState('');
      const [address, setAddress] = useState('Indiranagar 100ft Road, Ward 12');
      const [ward, setWard] = useState('Ward 12 - Indiranagar');
      const [description, setDescription] = useState('');
      const [analyzing, setAnalyzing] = useState(false);
      const [detection, setDetection] = useState(null);
      const [prediction, setPrediction] = useState(null);
      const [submittedIssue, setSubmittedIssue] = useState(null);
      const [voiceListening, setVoiceListening] = useState(false);

      const samplePhotos = [
        { label: "Pothole on Arterial Road", url: "https://images.unsplash.com/photo-1515162816999-a0c47dc192f7?w=600&auto=format&fit=crop&q=80", type: "Pothole", dept: "PWD / Roads & Bridges", sev: 82, rain: 24.5 },
        { label: "Garbage Accumulation", url: "https://images.unsplash.com/photo-1605600659873-d808a13e4d2a?w=600&auto=format&fit=crop&q=80", type: "Garbage Dump", dept: "Solid Waste Management", sev: 64, rain: 12.0 },
        { label: "Underpass Waterlogging", url: "https://images.unsplash.com/photo-1547683905-f686c993aae5?w=600&auto=format&fit=crop&q=80", type: "Waterlogging", dept: "Stormwater & Drainage (BWSSB)", sev: 92, rain: 38.0 },
        { label: "Broken Streetlight", url: "https://images.unsplash.com/photo-1508873696983-2df5293cb32f?w=600&auto=format&fit=crop&q=80", type: "Broken Streetlight", dept: "Municipal Electrical Dept", sev: 36, rain: 5.0 }
      ];

      const handleSelectPhoto = (sample) => {
        setPhotoUrl(sample.url);
        setAnalyzing(true);
        setDetection(null);
        setPrediction(null);

        setTimeout(() => {
          setAnalyzing(false);
          setDetection({
            detected_type: sample.type,
            department: sample.dept,
            confidence: 0.94,
            initial_severity: sample.sev
          });
          setPrediction({
            severity_in_24_hours: Math.min(100, sample.sev + 12),
            severity_in_3_days: Math.min(100, sample.sev + 20),
            severity_in_7_days: Math.min(100, sample.sev + 28),
            priority: sample.sev >= 80 ? "HIGH" : sample.sev >= 40 ? "MEDIUM" : "LOW",
            rainfall_forecast_mm: sample.rain,
            traffic_density: "Heavy Arterial Transit",
            sla_hours: sample.sev >= 80 ? 24 : 48,
            recommended_action: sample.sev >= 80
              ? "Immediate emergency cold-mix patching & hazard barricading within 24 hours."
              : "Schedule ward maintenance team inspection."
          });
        }, 800);
      };

      const handleFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (file) {
          const url = URL.createObjectURL(file);
          handleSelectPhoto({
            label: "Citizen Upload",
            url,
            type: "Pothole",
            dept: "PWD / Roads & Bridges",
            sev: 76,
            rain: 18.0
          });
        }
      };

      const handleVoiceInput = () => {
        setVoiceListening(true);
        setTimeout(() => {
          setVoiceListening(false);
          setDescription("Deep crater pothole near Indiranagar metro station pillar 42. Causes two-wheeler skids especially in rain.");
          if (!photoUrl) {
            handleSelectPhoto(samplePhotos[0]);
          }
        }, 1500);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const rand = Math.floor(1000 + Math.random() * 9000);
        const srn = `CIVIC-W12-2026-${rand}`;
        const newIssue = {
          id: `issue-${Date.now()}`,
          srn,
          type: detection.detected_type,
          department: detection.department,
          latitude: 12.9716,
          longitude: 77.5946,
          address,
          ward_number: ward,
          severity: detection.initial_severity,
          status: "Submitted",
          upvotes: 1,
          image_url: photoUrl,
          after_image_url: null,
          created_at: "Just Now",
          sla_hours: prediction.sla_hours,
          prediction,
          action: {
            recommended_action: prediction.recommended_action
          }
        };

        onIssueCreated(newIssue);
        setSubmittedIssue(newIssue);
      };

      return (
        <div className="max-w-4xl mx-auto py-8 px-4">
          <div className="text-center mb-8">
            <span className="inline-block px-3 py-1 rounded-full text-xs font-bold bg-blue-100 text-blue-800 border border-blue-200 mb-3">
              ✨ AI-Powered Municipal Grievance Redressal
            </span>
            <h2 className="text-3xl font-extrabold text-slate-900 tracking-tight">
              Report a Civic Issue in 60 Seconds
            </h2>
            <p className="mt-2 text-sm text-slate-600 max-w-xl mx-auto">
              Snap a photo or dictate by voice. Computer vision classifies the hazard, connects Open-Meteo precipitation models, and alerts the ward junior engineer.
            </p>
          </div>

          {submittedIssue ? (
            <div className="bg-white rounded-2xl shadow-lg border border-emerald-200 p-8 text-center">
              <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
                ✓
              </div>
              <h3 className="text-2xl font-bold text-slate-900">Grievance Registered Successfully</h3>
              <p className="text-slate-600 text-sm mt-1">Logged into Municipal Integrated Command & Control System (ICCC).</p>

              <div className="bg-slate-50 border border-slate-200 rounded-xl p-5 my-6 max-w-md mx-auto text-left">
                <div className="flex justify-between items-center pb-3 border-b border-slate-200">
                  <span className="text-xs font-bold uppercase text-slate-500">Service Request Number (SRN)</span>
                  <span className="font-mono font-bold text-blue-700 bg-blue-50 px-2.5 py-1 rounded border border-blue-200">
                    {submittedIssue.srn}
                  </span>
                </div>
                <div className="pt-3 space-y-1.5 text-sm text-slate-600">
                  <div className="flex justify-between">
                    <span>Category:</span>
                    <strong className="text-slate-900">{submittedIssue.type}</strong>
                  </div>
                  <div className="flex justify-between">
                    <span>Department:</span>
                    <strong className="text-slate-900">{submittedIssue.department}</strong>
                  </div>
                  <div className="flex justify-between">
                    <span>Target Resolution SLA:</span>
                    <strong className="text-emerald-700">{submittedIssue.sla_hours} Hours</strong>
                  </div>
                </div>
              </div>

              <div className="flex justify-center space-x-4">
                <button
                  onClick={() => onTrack(submittedIssue.srn)}
                  className="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-2.5 rounded-xl shadow"
                >
                  Track Resolution Live →
                </button>
                <button
                  onClick={() => {
                    setSubmittedIssue(null);
                    setPhotoUrl('');
                    setDetection(null);
                  }}
                  className="border border-slate-300 text-slate-700 hover:bg-slate-100 font-semibold px-5 py-2.5 rounded-xl"
                >
                  Report Another
                </button>
              </div>
            </div>
          ) : (
            <form onSubmit={handleSubmit} className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 space-y-6">
              {/* Voice Complaint Button */}
              <div className="bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-200 rounded-xl p-4 flex flex-col sm:flex-row items-center justify-between gap-3">
                <div className="flex items-center space-x-3">
                  <div className="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center text-lg">
                    🎙️
                  </div>
                  <div>
                    <h4 className="text-xs font-bold text-slate-900">Multilingual Voice Grievance Assistant</h4>
                    <p className="text-[11px] text-slate-500">Tap to speak in English, Hindi, or Regional languages.</p>
                  </div>
                </div>
                <button
                  type="button"
                  onClick={handleVoiceInput}
                  disabled={voiceListening}

              Interactive City Budget Simulation
            </div>
            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-6 border-b border-slate-800">
              <div>
                <span className="text-xs text-slate-400">Total Taxpayer Funds Saved This Quarter</span>
                <div className="text-4xl font-black text-emerald-400 mt-1">
                  ${totalSaved.toLocaleString()} <span className="text-sm font-semibold text-slate-400">(~₹{(totalSaved * 83).toLocaleString()})</span>
                </div>
              </div>
              <div className="bg-slate-800 px-4 py-2 rounded-xl border border-slate-700 text-right">
                <span className="text-[10px] uppercase text-slate-400 block font-bold">Accidents Prevented</span>
                <span className="text-xl font-bold text-amber-400">{Math.round(earlyFixedCount * 0.42)} Incidents</span>
              </div>
            </div>

            <div className="py-6 space-y-3">
              <div className="flex justify-between text-xs font-semibold">
                <label>Simulate Early Potholes Detected & Fixed within 24h:</label>
                <span className="font-mono text-amber-400 font-bold">{earlyFixedCount} Repairs</span>
              </div>
              <input
                type="range"
                min="20"
                max="500"
                value={earlyFixedCount}
                onChange={(e) => setEarlyFixedCount(Number(e.target.value))}
                className="w-full accent-emerald-500 h-2 bg-slate-800 rounded-lg cursor-pointer"
              />
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-4 border-t border-slate-800 text-xs">
              <div className="bg-emerald-950/60 p-4 rounded-xl border border-emerald-800/60">
                <span className="text-emerald-400 font-bold block mb-1">With CivicPulse AI (Proactive)</span>
                <p className="text-slate-300">Total expenditure: <strong>${earlyCost.toLocaleString()}</strong></p>
                <span className="text-[11px] text-slate-400 mt-1 block">Patched immediately using cold-mix asphalt before monsoon rains expand crater.</span>
              </div>

              <div className="bg-rose-950/60 p-4 rounded-xl border border-rose-800/60">
                <span className="text-rose-400 font-bold block mb-1">Traditional Municipal Flow (Reactive)</span>
                <p className="text-slate-300">Total expenditure: <strong>${delayedCost.toLocaleString()}</strong></p>
                <span className="text-[11px] text-slate-400 mt-1 block">Neglected until crater damages vehicles, requiring full sub-base resurfacing.</span>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 6. MUNICIPAL ICCC CONTROL CENTER VIEW
    // ==========================================
    function IcccView({ issues, onAssign, onResolve, onSelectSrn }) {
      const [filterDept, setFilterDept] = useState('All');
      const [filterStatus, setFilterStatus] = useState('All');
      const [viewMode, setViewMode] = useState('table');
      const [modalIssue, setModalIssue] = useState(null);
      const [modalMode, setModalMode] = useState('');
      const [official, setOfficial] = useState('Er. R. Venkatesh (JE)');
      const [team, setTeam] = useState('PWD Rapid Response Unit 4');
      const [notes, setNotes] = useState('');

      const filtered = issues.filter(i => {
        const d = filterDept === 'All' || i.department.toLowerCase().includes(filterDept.toLowerCase());
        const s = filterStatus === 'All' || i.status.toLowerCase() === filterStatus.toLowerCase();
        return d && s;
      });

      return (
        <div className="max-w-7xl mx-auto py-8 px-4 sm:px-6 space-y-6">
          <div className="flex flex-col md:flex-row justify-between gap-4">
            <div>
              <div className="flex items-center space-x-2 text-xs font-mono font-bold text-slate-500 uppercase">
                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                <span>MUNICIPAL LIVE OPERATIONS ROOM</span>
              </div>
              <h2 className="text-2xl font-black text-slate-900">Integrated Command & Control Center (ICCC)</h2>
              <p className="text-xs text-slate-500">Live triage queue, GIS dispatch, and SLA enforcement console.</p>
            </div>

            <div className="flex bg-slate-200 p-1 rounded-xl text-xs font-bold self-start">
              <button
                onClick={() => setViewMode('table')}
                className={`px-4 py-2 rounded-lg transition ${viewMode === 'table' ? 'bg-white text-blue-700 shadow' : 'text-slate-600'}`}
              >
                📋 Triage Queue
              </button>
              <button
                onClick={() => setViewMode('map')}
                className={`px-4 py-2 rounded-lg transition ${viewMode === 'map' ? 'bg-white text-blue-700 shadow' : 'text-slate-600'}`}
              >
                🗺️ Interactive GIS Map
              </button>
            </div>
          </div>

          {/* KPI Ribbon */}
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
              <div className="text-xs font-bold text-slate-500 uppercase">Total Logged</div>
              <div className="text-3xl font-black text-slate-900 mt-1">{issues.length}</div>
            </div>
            <div className="bg-white p-5 rounded-2xl border border-rose-200 shadow-sm">
              <div className="text-xs font-bold text-rose-600 uppercase">Critical Emergencies (&gt;80)</div>
              <div className="text-3xl font-black text-rose-600 mt-1">
                {issues.filter(i => i.severity >= 80 && i.status !== 'Resolved').length}
              </div>
            </div>
            <div className="bg-white p-5 rounded-2xl border border-amber-200 shadow-sm">
              <div className="text-xs font-bold text-amber-600 uppercase">Active Field Crews</div>
              <div className="text-3xl font-black text-amber-600 mt-1">
                {issues.filter(i => i.status === 'Assigned' || i.status === 'In Progress').length}
              </div>
            </div>
            <div className="bg-white p-5 rounded-2xl border border-emerald-200 shadow-sm">
              <div className="text-xs font-bold text-emerald-600 uppercase">Resolved Closed</div>
              <div className="text-3xl font-black text-emerald-600 mt-1">
                {issues.filter(i => i.status === 'Resolved').length}
              </div>
            </div>
          </div>

          {viewMode === 'map' ? (
            <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
              <MapComponent issues={filtered} />
            </div>
          ) : (
            <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
              <div className="p-4 bg-slate-50 border-b border-slate-200 flex flex-wrap justify-between gap-3 text-xs">
                <div className="flex gap-2">
                  <select
                    value={filterDept}
                    onChange={(e) => setFilterDept(e.target.value)}
                    className="px-3 py-1.5 rounded-lg border bg-white font-medium"
                  >
                    <option value="All">All Departments</option>
                    <option value="PWD">PWD / Roads & Bridges</option>
                    <option value="Solid Waste">Solid Waste Management</option>
                    <option value="Stormwater">Drainage & Stormwater (BWSSB)</option>
                    <option value="Electrical">Electrical Department</option>
                  </select>

                  <select
                    value={filterStatus}
                    onChange={(e) => setFilterStatus(e.target.value)}
                    className="px-3 py-1.5 rounded-lg border bg-white font-medium"
                  >
                    <option value="All">All Statuses</option>
                    <option value="Submitted">Submitted (Needs Triage)</option>
                    <option value="Assigned">Assigned</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Resolved">Resolved</option>
                  </select>
                </div>
              </div>

              <div className="overflow-x-auto">
                <table className="w-full text-left text-sm">
                  <thead className="bg-slate-100 text-slate-700 text-xs uppercase font-bold border-b border-slate-200">
                    <tr>
                      <th className="py-3 px-4">SRN / Category</th>
                      <th className="py-3 px-4">Ward & Location</th>
                      <th className="py-3 px-4">Severity</th>
                      <th className="py-3 px-4">Priority & SLA</th>
                      <th className="py-3 px-4">Status</th>
                      <th className="py-3 px-4 text-right">Actions</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-200 text-xs">
                    {filtered.map(item => (
                      <tr key={item.id} className="hover:bg-slate-50 transition">
                        <td className="py-3 px-4">
                          <div className="flex items-center space-x-3">
                            <img src={item.image_url} alt="" className="w-10 h-10 rounded-lg object-cover border" />
                            <div>
                              <span
                                onClick={() => onSelectSrn(item.srn)}
                                className="font-mono font-bold text-blue-600 hover:underline cursor-pointer block"
                              >
                                {item.srn}
                              </span>
                              <span className="font-bold text-slate-900 text-sm">{item.type}</span>
                            </div>
                          </div>
                        </td>
                        <td className="py-3 px-4">
                          <div className="font-bold text-slate-900">{item.ward_number}</div>
                          <div className="text-[11px] text-slate-500 max-w-xs truncate">{item.address}</div>
                        </td>
                        <td className="py-3 px-4">
                          <span className={`font-mono font-bold text-sm ${item.severity >= 80 ? 'text-rose-600' : 'text-amber-600'}`}>
                            {item.severity} / 100
                          </span>
                        </td>
                        <td className="py-3 px-4">
                          <span className={`px-2 py-0.5 rounded font-bold uppercase text-[10px] ${
                            (item.prediction?.priority || 'HIGH') === 'HIGH' ? 'bg-rose-100 text-rose-800' : 'bg-amber-100 text-amber-800'
                          }`}>
                            {item.prediction?.priority || 'HIGH'} ({item.sla_hours}h SLA)
                          </span>
                        </td>
                        <td className="py-3 px-4">
                          <span className={`px-2.5 py-1 rounded-full font-bold text-[11px] ${
                            item.status === 'Resolved' ? 'bg-emerald-100 text-emerald-800' : 'bg-blue-100 text-blue-800'
                          }`}>
                            {item.status}
                          </span>
                        </td>
                        <td className="py-3 px-4 text-right">
                          {item.status !== 'Resolved' ? (
                            <div className="flex justify-end gap-1.5">
                              <button
                                onClick={() => {
                                  setModalIssue(item);
                                  setModalMode('assign');
                                }}
                                className="bg-blue-600 hover:bg-blue-700 text-white font-bold px-2.5 py-1 rounded-lg"
                              >
                                Dispatch
                              </button>
                              <button
                                onClick={() => {
                                  setModalIssue(item);
                                  setModalMode('resolve');
                                }}
                                className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-2.5 py-1 rounded-lg"
                              >
                                Resolve
                              </button>
                            </div>
                          ) : (
                            <span className="text-emerald-600 font-bold">✓ Closed</span>
                          )}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* Modal */}
          {modalIssue && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border">
                <h3 className="text-lg font-bold text-slate-900 mb-1">
                  {modalMode === 'assign' ? 'Dispatch Work Order' : 'Validate Proof & Close Grievance'} — {modalIssue.srn}
                </h3>
                <p className="text-xs text-slate-500 mb-4">{modalIssue.type} | {modalIssue.ward_number}</p>

                {modalMode === 'assign' ? (
                  <div className="space-y-3 text-xs">
                    <div>
                      <label className="font-bold block mb-1">Junior Engineer</label>
                      <input type="text" value={official} onChange={(e) => setOfficial(e.target.value)} className="w-full p-2 border rounded-lg" />
                    </div>
                    <div>
                      <label className="font-bold block mb-1">Field Unit</label>
                      <input type="text" value={team} onChange={(e) => setTeam(e.target.value)} className="w-full p-2 border rounded-lg" />
                    </div>
                    <div>
                      <label className="font-bold block mb-1">Action Directive</label>
                      <textarea value={notes} onChange={(e) => setNotes(e.target.value)} placeholder="Cold-mix asphalt patch within 24h" className="w-full p-2 border rounded-lg" rows={2}></textarea>
                    </div>
                    <div className="flex justify-end gap-2 pt-2 border-t">
                      <button onClick={() => setModalIssue(null)} className="px-3 py-1.5 border rounded-lg font-bold">Cancel</button>
                      <button
                        onClick={() => {
                          onAssign(modalIssue.id, official, team, notes);
                          setModalIssue(null);
                        }}
                        className="bg-blue-600 text-white px-4 py-1.5 rounded-lg font-bold"
                      >
                        Confirm Dispatch
                      </button>
                    </div>
                  </div>
                ) : (
                  <div className="space-y-3 text-xs">
                    <div>
                      <label className="font-bold block mb-1">Completion Notes</label>
                      <textarea value={notes} onChange={(e) => setNotes(e.target.value)} placeholder="Road surface leveled and cleared." className="w-full p-2 border rounded-lg" rows={3}></textarea>
                    </div>
                    <div className="flex justify-end gap-2 pt-2 border-t">
                      <button onClick={() => setModalIssue(null)} className="px-3 py-1.5 border rounded-lg font-bold">Cancel</button>
                      <button
                        onClick={() => {
                          onResolve(modalIssue.id, notes);
                          setModalIssue(null);
                        }}
                        className="bg-emerald-600 text-white px-4 py-1.5 rounded-lg font-bold"
                      >
                        Confirm Closure
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    // Leaflet Map Component
    function MapComponent({ issues }) {
      const mapRef = useRef(null);
      const leafletMap = useRef(null);

      useEffect(() => {
        if (!mapRef.current || !window.L) return;

        if (!leafletMap.current) {
          const map = window.L.map(mapRef.current).setView([12.9716, 77.5946], 13);
          window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
          leafletMap.current = map;
        }

        const map = leafletMap.current;

        issues.forEach(issue => {
          if (!issue.latitude || !issue.longitude) return;
          const color = issue.status === 'Resolved' ? '#10b981' : issue.severity >= 80 ? '#ef4444' : '#f59e0b';
          const icon = window.L.divIcon({
            className: 'custom-pin',
            html: `<div style="background:${color};width:26px;height:26px;border-radius:50%;border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.3);color:white;font-weight:bold;font-size:11px;display:flex;align-items:center;justify-content:center;">${issue.severity >= 80 ? '!' : '●'}</div>`,
            iconSize: [26, 26]
          });
          window.L.marker([issue.latitude, issue.longitude], { icon })
            .addTo(map)
            .bindPopup(`<strong>${issue.srn}</strong><br/>${issue.type}<br/>Severity: ${issue.severity}/100<br/>${issue.ward_number}`);
        });
      }, [issues]);

      return <div ref={mapRef} style={{ width: '100%', height: '450px', borderRadius: '1rem' }}></div>;
    }

    // Render Root
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
