    function loadDatabase() {
      try {
        const stored = localStorage.getItem(DB_KEY);
        if (stored) return JSON.parse(stored);
      } catch (e) {
        console.warn("Storage read error, using fallback seed", e);
      }
      return DEFAULT_SEED_ISSUES;
    }

    function saveDatabase(issues) {
      try {
        localStorage.setItem(DB_KEY, JSON.stringify(issues));
      } catch (e) {
        console.error("Storage write error", e);
      }
    }

    // Google Maps Script Loader
    function loadGoogleMapsScript(apiKey, callback) {
      if (window.google && window.google.maps) {
        if (callback) callback();
        return;
      }
      if (!apiKey) return;

      const existingScript = document.getElementById('gmaps-sdk');
      if (existingScript) existingScript.remove();

      const script = document.createElement('script');
      script.id = 'gmaps-sdk';
      script.src = `https://maps.googleapis.com/maps/api/js?key=${apiKey}&libraries=places`;
      script.async = true;
      script.defer = true;
      script.onload = () => {
        if (callback) callback();
      };
      document.head.appendChild(script);
    }

    // Reverse Geocoding helper using OSM Nominatim API
    async function reverseGeocodeRealGps(lat, lon) {
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`, {
          headers: { 'Accept': 'application/json' }
        });
        if (res.ok) {
          const data = await res.json();
          if (data && data.display_name) {
            const addr = data.address || {};
            const street = addr.road || addr.pedestrian || addr.suburb || addr.neighbourhood || "Main Road";
            const city = addr.city || addr.town || addr.state_district || addr.state || "";
            const postcode = addr.postcode ? ` - ${addr.postcode}` : "";
            const wardStr = addr.suburb || addr.neighbourhood || addr.city_district || "Central Zone";
            return {
              formattedAddress: `${street}, ${city}${postcode}`,
              ward: `Ward - ${wardStr}`
            };
          }
        }
      } catch (e) {
        console.warn("Reverse geocode network notice:", e);
      }
      return {
        formattedAddress: `Live GPS: ${lat.toFixed(6)}° N, ${lon.toFixed(6)}° E`,
        ward: "Ward - Detected Zone"
      };
    }

        { label: "Underpass Waterlogging", url: "https://images.unsplash.com/photo-1547683905-f686c993aae5?w=600&auto=format&fit=crop&q=80", type: "Waterlogging", dept: "Stormwater & Drainage (BWSSB)", sev: 92, rain: 38.0, lat: 12.9790, lon: 77.5850, addr: "Railway Underpass, Seshadripuram" },
        { label: "Broken Streetlight", url: "https://images.unsplash.com/photo-1508873696983-2df5293cb32f?w=600&auto=format&fit=crop&q=80", type: "Broken Streetlight", dept: "Municipal Electrical Dept", sev: 36, rain: 5.0, lat: 12.9550, lon: 77.6150, addr: "Koramangala 5th Block, 80 Feet Road Junction" }
      ];

      // Update location and trigger real reverse geocode
      const updateLocationCoordinates = async (lat, lng, radius = 10, markAsReal = false) => {
        const roundedLat = parseFloat(lat.toFixed(6));
        const roundedLng = parseFloat(lng.toFixed(6));
        setCoords({ lat: roundedLat, lon: roundedLng });
        setAccuracyRadius(radius);
        if (markAsReal) setIsRealGpsLocked(true);

        const geoResult = await reverseGeocodeRealGps(roundedLat, roundedLng);
        setAddress(geoResult.formattedAddress);
        setWard(geoResult.ward);
      };

      // REAL GPS: Acquire real physical device GPS location
      const handleAcquireRealGps = () => {
        setLocatingGps(true);
        if (!navigator.geolocation) {
          alert("Geolocation is not supported by your browser");
          setLocatingGps(false);
          return;
        }

        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            const acc = Math.round(pos.coords.accuracy || 8);

            setRealUserGps({ lat, lon: lng, accuracy: acc });
            await updateLocationCoordinates(lat, lng, acc, true);

            // Center active map on REAL device coordinates
            if (mapEngine === 'google' && gmapInstance.current && gmapMarker.current) {
              gmapInstance.current.setCenter({ lat, lng });
              gmapInstance.current.setZoom(17);
              gmapMarker.current.setPosition({ lat, lng });
            } else if (osmInstance.current && osmMarker.current) {
              osmInstance.current.setView([lat, lng], 17);
              osmMarker.current.setLatLng([lat, lng]);

              // Update blue accuracy circle
              if (osmUserGpsCircle.current) {
                osmUserGpsCircle.current.setLatLng([lat, lng]);
                osmUserGpsCircle.current.setRadius(acc);
              } else {
                osmUserGpsCircle.current = window.L.circle([lat, lng], {
                  radius: acc,
                  color: '#2563eb',
                  fillColor: '#3b82f6',
                  fillOpacity: 0.15
                }).addTo(osmInstance.current);
              }
            }
            setLocatingGps(false);
          },
          (err) => {
            console.warn("Real GPS access error:", err.message);
            alert(`GPS Notice: ${err.message}. Please enable location permissions in your browser.`);
            setLocatingGps(false);
          },
          { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }

      };

                center: { lat: coords.lat, lng: coords.lon },
                zoom: 15,
                mapTypeId: 'roadmap',
                streetViewControl: false,
                mapTypeControl: true

              const marker = new window.google.maps.Marker({
                position: { lat: coords.lat, lng: coords.lon },

                draggable: true,
                title: "Drag to exact hazard spot",
                animation: window.google.maps.Animation.DROP

              marker.addListener('dragend', (e) => {
                updateLocationCoordinates(e.latLng.lat(), e.latLng.lng(), 5, false);
              });

              map.addListener('click', (e) => {
                marker.setPosition(e.latLng);
                updateLocationCoordinates(e.latLng.lat(), e.latLng.lng(), 5, false);
              });

              gmapInstance.current = map;
              gmapMarker.current = marker;
            }
            return;
          } catch (e) {
            console.warn("Google Maps init fallback to OSM", e);
            setMapEngine('osm');
          }
        }

        // 2. OpenStreetMap Leaflet Engine
        if (window.L && !osmInstance.current) {
          const map = window.L.map(miniMapContainerRef.current, {
            center: [coords.lat, coords.lon],
            zoom: 15,
            attributionControl: false
          });

          window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

          // Red Hazard Pin
          const markerIcon = window.L.divIcon({

            iconSize: [32, 32],
            iconAnchor: [16, 16]
          });

          const marker = window.L.marker([coords.lat, coords.lon], {
            draggable: true,
            icon: markerIcon
          }).addTo(map);

          marker.bindTooltip("Drag pin to exact road spot or click anywhere on map", { permanent: true, direction: 'top' });

          marker.on('dragend', (e) => {
            const pos = e.target.getLatLng();
            updateLocationCoordinates(pos.lat, pos.lng, 5, false);
          });

          map.on('click', (e) => {
            marker.setLatLng(e.latlng);
            updateLocationCoordinates(e.latlng.lat, e.latlng.lng, 5, false);
          });

          osmInstance.current = map;
          osmMarker.current = marker;

      const handleSelectPhoto = async (sample) => {

    function TrackerView({ initialSrn, issues, onUpvote }) {
      const [srnInput, setSrnInput] = useState(initialSrn || 'CIVIC-W12-2026-8419');
      const [issue, setIssue] = useState(null);
      const [upvoted, setUpvoted] = useState(false);

      useEffect(() => {
        const found = issues.find(i => i.srn.toLowerCase() === srnInput.trim().toLowerCase());
        setIssue(found || issues[0]);
        setUpvoted(false);
      }, [srnInput, issues]);

      const stages = [
        { label: "1. Logged", desc: "Geo-tagged photo & Pin" },
        { label: "2. AI Triaged", desc: "YOLO + Weather score" },
        { label: "3. Work Order", desc: "Assigned to Engineer" },
        { label: "4. In Progress", desc: "Field contractor on-site" },
        { label: "5. Resolved", desc: "Proof validated" }
      ];

      const getStageIdx = (status) => {
        if (status === 'Submitted') return 0;
        if (status === 'Triaged') return 1;
        if (status === 'Assigned') return 2;
        if (status === 'In Progress') return 3;
        if (status === 'Resolved') return 4;
        return 1;
      };

      return (
        <div className="max-w-4xl mx-auto py-8 px-4">
          <div className="text-center mb-8">
            <h2 className="text-3xl font-extrabold text-slate-900 tracking-tight">Track Grievance Status</h2>
            <p className="mt-2 text-sm text-slate-600">Enter your Service Request Number (SRN) to view field progress & SLA timers.</p>

            <div className="mt-6 max-w-md mx-auto flex gap-2">
              <input
                type="text"
                value={srnInput}
                onChange={(e) => setSrnInput(e.target.value)}
                placeholder="e.g. CIVIC-W12-2026-8419"
                className="flex-1 px-4 py-2.5 rounded-xl border border-slate-300 font-mono text-sm uppercase font-bold"
              />
            </div>
          </div>

          {issue && (
            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
              <div className="bg-slate-900 text-white p-6 flex flex-col md:flex-row justify-between gap-4">
                <div>
                  <div className="flex items-center space-x-3 mb-2">
                    <span className="font-mono font-bold text-amber-400 bg-slate-800 px-3 py-1 rounded border border-slate-700">
                      {issue.srn}
                    </span>
                    <span className="bg-blue-600 text-white text-xs font-bold px-2.5 py-1 rounded-full uppercase">
                      {issue.status}
                    </span>
                  </div>
                  <h3 className="text-xl font-bold">{issue.type} — {issue.ward_number}</h3>
                  <p className="text-xs text-slate-400 mt-1">{issue.address}</p>
                </div>

                <div className="flex items-center gap-2">
                  <a
                    href={`https://www.google.com/maps/dir/?api=1&destination=${issue.latitude},${issue.longitude}`}
                    target="_blank"
                    className="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-1 shadow"
                  >
                    <span>🧭 Google Maps Route</span>
                  </a>
                  <button
                    onClick={() => {
                      onUpvote(issue.id);
                      setUpvoted(true);
                    }}
                    disabled={upvoted}
                    className="bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold px-4 py-2 rounded-xl border border-slate-700"
                  >
                    👍 {upvoted ? 'Upvoted (+1)' : 'Me Too / Impacted'} ({issue.upvotes})
                  </button>
                </div>
              </div>

              <div className="p-6 md:p-8 space-y-6">
                <div>
                  <h4 className="text-xs font-bold uppercase tracking-wider text-slate-500 mb-4">Official Redressal Timeline</h4>
                  <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
                    {stages.map((stg, idx) => {
                      const cur = getStageIdx(issue.status);
                      const isDone = idx <= cur;
                      const isCurrent = idx === cur;
                      return (
                        <div
                          key={idx}
                          className={`p-3 rounded-xl border text-xs ${
                            isCurrent ? 'bg-blue-50 border-blue-500 ring-1 ring-blue-500 font-bold' : isDone ? 'bg-emerald-50 border-emerald-300' : 'bg-slate-50 border-slate-200 opacity-60'
                          }`}
                        >
                          <div className="flex items-center space-x-1.5 mb-1">
                            <span className={`w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-bold ${isDone ? 'bg-emerald-500 text-white' : 'bg-slate-300'}`}>
                              {isDone ? '✓' : idx + 1}
                            </span>
                            <span className="font-bold">{stg.label}</span>
                          </div>
                          <span className="text-[11px] text-slate-500 font-normal">{stg.desc}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Before / After Photo Comparison */}
                <div className="pt-4 border-t border-slate-200">
                  <h4 className="text-xs font-bold uppercase tracking-wider text-slate-500 mb-3">
                    Audit Evidence: Before & After Resolution Proof
                  </h4>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div className="border border-slate-200 rounded-xl overflow-hidden bg-slate-100">
                      <div className="bg-slate-800 text-white text-[10px] font-bold px-3 py-1 uppercase tracking-wider">
                        Initial Citizen Evidence (Before)
                      </div>
                      <img src={issue.image_url} alt="Before" className="w-full h-44 object-cover" />
                    </div>

                    <div className="border border-slate-200 rounded-xl overflow-hidden bg-slate-100">
                      <div className="bg-emerald-800 text-white text-[10px] font-bold px-3 py-1 uppercase tracking-wider">
                        Field Repair Proof of Work (After)
                      </div>
                      {issue.after_image_url ? (
                        <img src={issue.after_image_url} alt="After" className="w-full h-44 object-cover" />
                      ) : (
                        <div className="h-44 flex flex-col items-center justify-center text-slate-400 p-4 text-center">
                          <span className="text-2xl mb-1">⏳</span>
                          <span className="text-xs font-bold">Field repair in progress</span>
                          <span className="text-[10px]">Photo proof pending junior engineer upload</span>
                        </div>
                      )}
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-4 border-t border-slate-200">
                  <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 text-xs space-y-2">
                    <div className="font-bold text-slate-800">🛡️ Municipal Assignments</div>
                    <div>Department: <strong>{issue.department}</strong></div>
                    <div>Engineer: <strong>{issue.action?.assigned_official || 'Er. R. Venkatesh (JE)'}</strong></div>
                    <div>Unit: <strong>{issue.action?.assigned_team || 'PWD Rapid Response Unit 4'}</strong></div>
                    <div>Work Order: <strong className="font-mono text-blue-700">{issue.action?.work_order_id || 'WO-PWD-2026-118'}</strong></div>
                  </div>

                  <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 text-xs space-y-2">
                    <div className="font-bold text-slate-800">⏳ SLA & Risk Guarantee</div>
                    <div>Target SLA: <strong className="text-emerald-700">{issue.sla_hours} Hours Maximum</strong></div>
                    <div>Current Severity: <strong className="text-rose-600">{issue.severity} / 100</strong></div>
                    <div>3-Day Escalation: <strong className="text-orange-600">{issue.prediction?.severity_in_3_days}/100</strong></div>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function WardLeaderboardView({ issues }) {
      const wardMap = {};
      const defaultWards = [
        "Ward 08 - North Gate",
        "Ward 12 - Indiranagar",
        "Ward 15 - South East",
        "Ward 04 - West Central",
        "Ward 14 - Market East"
      ];

      defaultWards.forEach(w => {
        wardMap[w] = { name: w, active: 0, resolved: 0 };
      });

      issues.forEach(i => {
        const w = i.ward_number || "Ward 12 - Indiranagar";
        if (!wardMap[w]) wardMap[w] = { name: w, active: 0, resolved: 0 };
        if (i.status === 'Resolved') wardMap[w].resolved += 1;
        else wardMap[w].active += 1;
      });

      const wardList = Object.values(wardMap).map((w, idx) => {
        const total = w.active + w.resolved;
        const rate = total > 0 ? ((w.resolved / total) * 100).toFixed(1) : "95.0";
        return {
          ...w,
          resolutionRate: `${rate}%`,
          avgHours: `${14 + idx * 7}h`,
          badge: idx === 0 ? "🥇" : idx === 1 ? "🥈" : idx === 2 ? "🥉" : "⚠️",
          status: idx === 0 ? "Top Performer" : idx === 4 ? "SLA Review" : "Good Standing"
        };
      }).sort((a, b) => parseFloat(b.resolutionRate) - parseFloat(a.resolutionRate));

      return (
        <div className="max-w-5xl mx-auto py-8 px-4 space-y-6">

    // City Map Component with Google Maps & OpenStreetMap Real GPS Pulse Support
    function CityMapComponent({ issues, realUserGps, googleApiKey, gmapsLoaded }) {
      const mapContainerRef = useRef(null);
      const [useGoogle, setUseGoogle] = useState(() => Boolean(googleApiKey && window.google));
      const gmapRef = useRef(null);
      const osmRef = useRef(null);
      const markersGroup = useRef([]);

      const handlePanToRealLocation = () => {
        if (!realUserGps) return;
        if (useGoogle && gmapRef.current) {
          gmapRef.current.setCenter({ lat: realUserGps.lat, lng: realUserGps.lon });
          gmapRef.current.setZoom(16);
        } else if (osmRef.current) {
          osmRef.current.setView([realUserGps.lat, realUserGps.lon], 16);
        }
      };

      useEffect(() => {
        if (!mapContainerRef.current) return;

        // Center on real device GPS if available, else default Indiranagar
        const centerLat = realUserGps ? realUserGps.lat : 12.9716;
        const centerLon = realUserGps ? realUserGps.lon : 77.5946;

        // 1. Google Maps Mode
        if (useGoogle && window.google && window.google.maps) {
          try {
            if (!gmapRef.current) {
              const map = new window.google.maps.Map(mapContainerRef.current, {
                center: { lat: centerLat, lng: centerLon },
                zoom: 14,
                mapTypeId: 'roadmap',
                mapTypeControl: true
              });

              const trafficLayer = new window.google.maps.TrafficLayer();
              trafficLayer.setMap(map);

              // User's Real Location Marker
              if (realUserGps) {
                new window.google.maps.Marker({
                  position: { lat: realUserGps.lat, lng: realUserGps.lon },
                  map: map,
                  icon: {
                    path: window.google.maps.SymbolPath.CIRCLE,
                    scale: 8,
                    fillColor: "#2563eb",
                    fillOpacity: 1,
                    strokeColor: "#ffffff",
                    strokeWeight: 2
                  },
                  title: "Your Real Device GPS Location"
                });
              }

              gmapRef.current = map;
            }

            const map = gmapRef.current;
            issues.forEach(issue => {
              if (!issue.latitude || !issue.longitude) return;
              const marker = new window.google.maps.Marker({
                position: { lat: issue.latitude, lng: issue.longitude },
                map: map,
                title: `${issue.srn} - ${issue.type}`
              });

              const infoWindow = new window.google.maps.InfoWindow({
                content: `<div style="font-family:sans-serif;padding:4px;">
                  <strong style="color:#2563eb;">${issue.srn}</strong><br/>
                  <strong>${issue.type}</strong><br/>
                  Severity: ${issue.severity}/100<br/>
                  ${issue.ward_number}<br/>
                  <a href="https://www.google.com/maps/dir/?api=1&destination=${issue.latitude},${issue.longitude}" target="_blank" style="color:#1d4ed8;font-weight:bold;text-decoration:underline;">Directions &rarr;</a>
                </div>`
              });

              marker.addListener('click', () => {
                infoWindow.open(map, marker);
              });
            });
            return;
          } catch (e) {
            console.warn("Gmaps init failed, switching to OSM", e);
            setUseGoogle(false);
          }
        }

        // 2. OpenStreetMap Leaflet Mode
        if (window.L) {
          if (!osmRef.current) {
            const map = window.L.map(mapContainerRef.current).setView([centerLat, centerLon], 14);
            window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            // User Real Location Pulse Marker
            if (realUserGps) {
              const userIcon = window.L.divIcon({
                className: 'custom-pin',
                html: `<div class="gps-pulse-ring" style="background:#2563eb;width:20px;height:20px;border-radius:50%;border:3px solid white;box-shadow:0 0 10px rgba(37,99,235,0.8);"></div>`,
                iconSize: [20, 20]
              });
              window.L.marker([realUserGps.lat, realUserGps.lon], { icon: userIcon })
                .addTo(map)
                .bindPopup("<strong>You Are Here</strong><br/>Live Device GPS Location");
            }

            osmRef.current = map;
          }

          const map = osmRef.current;
          markersGroup.current.forEach(m => map.removeLayer(m));
          markersGroup.current = [];

          issues.forEach(issue => {
            if (!issue.latitude || !issue.longitude) return;
            const color = issue.status === 'Resolved' ? '#10b981' : issue.severity >= 80 ? '#ef4444' : '#f59e0b';
            const icon = window.L.divIcon({
              className: 'custom-pin',
              html: `<div style="background:${color};width:26px;height:26px;border-radius:50%;border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.3);color:white;font-weight:bold;font-size:11px;display:flex;align-items:center;justify-content:center;">${issue.severity >= 80 ? '!' : '●'}</div>`,
              iconSize: [26, 26]
            });
            const marker = window.L.marker([issue.latitude, issue.longitude], { icon })
              .addTo(map)
              .bindPopup(`<strong>${issue.srn}</strong><br/>${issue.type}<br/>Severity: ${issue.severity}/100<br/>${issue.ward_number}<br/><a href="https://www.google.com/maps/dir/?api=1&destination=${issue.latitude},${issue.longitude}" target="_blank" style="color:#2563eb;font-weight:bold;">Google Maps Directions &rarr;</a>`);
            markersGroup.current.push(marker);
          });
        }
      }, [useGoogle, gmapsLoaded, issues, realUserGps]);

      return (
        <div>
          <div className="flex justify-between items-center mb-2">
            <div className="flex items-center gap-2">
              <span className="text-xs font-bold text-slate-700">
                GIS Engine: {useGoogle && window.google ? '🗺️ Google Maps (with Live Traffic)' : '🌐 OpenStreetMap Tile Layer'}
              </span>
              {realUserGps && (
                <button
                  onClick={handlePanToRealLocation}
                  className="bg-blue-100 hover:bg-blue-200 text-blue-800 text-[10px] font-bold px-2 py-0.5 rounded border border-blue-300 flex items-center gap-1"
                >
                  <span>🎯 Pan to My Real GPS</span>
                </button>
              )}
            </div>
            {googleApiKey && (
              <button
                onClick={() => setUseGoogle(!useGoogle)}
                className="text-xs text-blue-600 hover:underline font-bold"
              >
                Switch to {useGoogle ? 'OpenStreetMap' : 'Google Maps'}
              </button>
            )}
          </div>
          <div ref={mapContainerRef} style={{ width: '100%', height: '450px', borderRadius: '1rem' }}></div>
        </div>
      );
    }

    // Render Root
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
